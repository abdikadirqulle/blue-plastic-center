services:
  - type: web
    name: blue-plastic-api
    runtime: node
    rootDir: .
    buildCommand: npm ci --include=dev && npm run build --workspace @blue-plastic/types && npm run build --workspace @blue-plastic/api
    startCommand: npm run start --workspace @blue-plastic/api
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.19.0
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: COOKIE_SECURE
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: WEB_ORIGIN
        sync: false
      - key: WEB_ORIGINS
        sync: false
